schema_version: '0.1'

# Example only. Values must be generated from the real Host and change package.
rescue:
  target:
    agent_card: https://agent-a.example/.well-known/agent-card.json
    host: agent-a-host.example
    service: agent-a

  change:
    package: 20260910T020900+0800__fix-a2a-channel
    created_at: 2026-09-10T02:09:00+08:00
    timezone: Asia/Shanghai
    status_file: /home/agent-a/.ena/changes/20260910T020900+0800__fix-a2a-channel/status.yaml
    expected_active_state: applied
    affected:
      - /etc/agent-a/a2a.yaml

  authorization_to_act:
    act_when_any:
      - automatic_rollback_deadline_passed_and_target_is_unreachable
      - automatic_rollback_reported_failed
      - human_authorized_recovery
    do_not_act_when_any:
      - target_has_already_confirmed_normal_bidirectional_communication
      - package_state_is_retained
      - package_state_is_restored
      - package_state_is_cancelled

  scope:
    restore_only:
      - /etc/agent-a/a2a.yaml
    do_not_modify_unrelated_state: true

  access:
    method: ssh
    endpoint: agent-a-host.example
    credential_reference: operator-managed-access

  known_good:
    backup: /home/agent-a/.ena/changes/20260910T020900+0800__fix-a2a-channel/backup/a2a.yaml
    backup_sha256: REPLACE_WITH_REAL_SHA256

  automatic_rollback:
    mechanism: systemd-run
    job_id: ena-rollback-20260910T020900+0800
    deadline: 2026-09-10T02:19:00+08:00
    status_check: systemctl status ena-rollback-20260910T020900+0800.service

  rollback:
    lock: /home/agent-a/.ena/changes/20260910T020900+0800__fix-a2a-channel/recovery.lock
    executable: /home/agent-a/.ena/changes/20260910T020900+0800__fix-a2a-channel/rollback.sh
    command: sudo /home/agent-a/.ena/changes/20260910T020900+0800__fix-a2a-channel/rollback.sh
    expected_result: restore_previous_a2a_configuration_and_restart_agent

  verify:
    service_check: systemctl is-active agent-a
    communication_check: establish_normal_bidirectional_A2A_or_human_conversation

  fallback:
    next_restore_point: REPLACE_WITH_REAL_SNAPSHOT_OR_VERSION
    escalation: REPLACE_WITH_REAL_HUMAN_OR_EXTERNAL_RECOVERY_PATH

  integrity:
    rescue_package_sha256: REPLACE_WITH_REAL_PACKAGE_DIGEST
