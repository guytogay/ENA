name: Reference tools

on:
  push:
  pull_request:

jobs:
  smoke-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/test_repo_hygiene.py
      - run: python tools/test_control_yaml.py
      - run: python tools/test_timezone_utils.py
      - run: python tools/test_jsonl_source.py
      - run: python tools/test_input_boundaries.py
      - run: python tools/test_candidate_record.py
      - run: python tools/test_ena_home.py
      - run: python tools/test_safe_change_gate.py
      - run: python tools/test_freshness_scan.py
      - run: python tools/self_test.py
