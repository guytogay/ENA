canonical_timezone: Asia/Shanghai
canonical_language: zh-CN

# ENA-owned text records use UTF-8.
text_encoding: UTF-8

# Stable pointers discovered or created during First Use.
runtime:
  host: null
  agent: null
  startup: null
  restart: null
  clock_sync: null

communication:
  human: null
  a2a:
    agent_card: null
    rescue_peers: []

survival:
  supervisor: null
  communication_probe: null
  external_escalation: null

recovery:
  acms: ~/.ena/acms
  changes: ~/.ena/changes
  rollback_scheduler: null
  backup_or_snapshot: null

evolution:
  records: ~/.ena/evolution
  sleep_dream_config: ~/.ena/evolution/sleep-dream.yaml
  experience_inbox: ~/.ena/evolution/experience
  candidates: ~/.ena/evolution/candidates
  scheduler: null
